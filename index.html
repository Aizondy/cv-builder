<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Builder — Create Professional Resumes</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1 class="logo">CV Builder</h1>
            <div class="header-actions">
                <select id="templateSelect" class="template-select">
                    <option value="modern">Modern</option>
                    <option value="classic">Classic</option>
                    <option value="minimal">Minimal</option>
                </select>
                <button id="exportPdf" class="btn btn-primary">Export PDF</button>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- Form Panel -->
        <section class="form-panel">
            <form id="cvForm" autocomplete="off">

                <!-- Personal Info -->
                <fieldset class="form-section">
                    <legend>Personal Information</legend>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fullName">Full Name</label>
                            <input type="text" id="fullName" placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="jobTitle">Job Title</label>
                            <input type="text" id="jobTitle" placeholder="Software Engineer">
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" placeholder="+1 234 567 890">
                        </div>
                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location" placeholder="New York, USA">
                        </div>
                        <div class="form-group">
                            <label for="website">Website / LinkedIn</label>
                            <input type="url" id="website" placeholder="https://linkedin.com/in/johndoe">
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label for="summary">Professional Summary</label>
                        <textarea id="summary" rows="3" placeholder="Brief overview of your professional background and goals..."></textarea>
                    </div>
                </fieldset>

                <!-- Experience -->
                <fieldset class="form-section">
                    <legend>Work Experience</legend>
                    <div id="experienceList" class="repeater-list"></div>
                    <button type="button" class="btn btn-add" data-add="experience">+ Add Experience</button>
                </fieldset>

                <!-- Education -->
                <fieldset class="form-section">
                    <legend>Education</legend>
                    <div id="educationList" class="repeater-list"></div>
                    <button type="button" class="btn btn-add" data-add="education">+ Add Education</button>
                </fieldset>

                <!-- Skills -->
                <fieldset class="form-section">
                    <legend>Skills</legend>
                    <div class="form-group">
                        <label for="skillsInput">Add skills (press Enter)</label>
                        <input type="text" id="skillsInput" placeholder="e.g. JavaScript">
                    </div>
                    <div id="skillsTags" class="skills-tags"></div>
                </fieldset>

                <!-- Languages -->
                <fieldset class="form-section">
                    <legend>Languages</legend>
                    <div id="languagesList" class="repeater-list"></div>
                    <button type="button" class="btn btn-add" data-add="language">+ Add Language</button>
                </fieldset>

            </form>
        </section>

        <!-- Preview Panel -->
        <section class="preview-panel">
            <div id="cvPreview" class="cv-preview template-modern">

                <div class="cv-header-section">
                    <h1 class="cv-name" id="prevName">Your Name</h1>
                    <p class="cv-title" id="prevTitle">Job Title</p>
                    <div class="cv-contact" id="prevContact"></div>
                </div>

                <div class="cv-body">
                    <div class="cv-section" id="prevSummarySection" style="display:none">
                        <h2 class="cv-section-title">Profile</h2>
                        <p id="prevSummary"></p>
                    </div>

                    <div class="cv-section" id="prevExperienceSection" style="display:none">
                        <h2 class="cv-section-title">Experience</h2>
                        <div id="prevExperience"></div>
                    </div>

                    <div class="cv-section" id="prevEducationSection" style="display:none">
                        <h2 class="cv-section-title">Education</h2>
                        <div id="prevEducation"></div>
                    </div>

                    <div class="cv-section" id="prevSkillsSection" style="display:none">
                        <h2 class="cv-section-title">Skills</h2>
                        <div id="prevSkills" class="cv-skills"></div>
                    </div>

                    <div class="cv-section" id="prevLanguagesSection" style="display:none">
                        <h2 class="cv-section-title">Languages</h2>
                        <div id="prevLanguages"></div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Built by <strong>Aizondy</strong> | <a href="https://github.com/Aizondy" target="_blank" rel="noopener">github.com/Aizondy</a></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
